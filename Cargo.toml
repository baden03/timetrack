[workspace]
resolver = "2"
members = ["crates/core", "crates/storage", "crates/app", "crates/hub"]
# The desktop shell has its own workspace so the core checks do not build Tauri.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/baden03/timetrack"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
