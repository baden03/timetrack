[package]
name = "timetrack-desktop"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iana-time-zone = "0.1"
timetrack-app = { path = "../../../crates/app" }
timetrack-storage = { path = "../../../crates/storage" }
