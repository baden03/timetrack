name: CI

# Checks are not run on every push or pull request at this stage; scripts/check.sh
# gives the same result locally. They run:
#  - by hand before a release: Actions, CI, "Run workflow" on the branch to be
#    released, or `gh workflow run ci.yml --ref <branch>`; and
#  - when a version tag (v0.0.1 and so on) is pushed, which is what publishing a
#    release does, so a published release always has a recorded result.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: scripts/no-network.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: pnpm run typecheck && pnpm test && pnpm run build
        working-directory: apps/desktop
      - run: cargo build && cargo test
        working-directory: apps/desktop/src-tauri
